# RASA 8 OTA price tracker configuration.
#
# Prices are auto-detected from each page's structured product data.
# If a shop fails, run:  python price_tracker.py --debug "<part of name>"
# and add a `selector = "..."` line (CSS selector for the price element).
# `currency` is only a fallback for pages that don't state one.

[settings]
min_drop_pct = 0.5        # ignore fluctuations smaller than this
# target_eur = 2400       # uncomment: alert when any shop reaches this (EUR, via ECB rates)

