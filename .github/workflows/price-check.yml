name: RASA 8 price check

on:
  schedule:
    - cron: "23 5 * * *"     # alerts + price summary, twice a day (UTC; off the hour, fewer delays)
    - cron: "23 17 * * *"
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Dry run (fetch and print only; no save, no notifications)"
        type: boolean
        default: false
      summary:
        description: "Send the price table for all shops"
        type: boolean
        default: true

permissions:
  contents: write             # to commit prices.db back

concurrency: price-check      # never two runs racing on prices.db

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check prices
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ inputs.summary }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--summary)
          fi
          python price_tracker.py "${args[@]}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save price history
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.db
          git diff --cached --quiet || git commit -m "Price check $(date -u +%F)"
          git push
